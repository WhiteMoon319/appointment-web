name = "appointment-worker"
main = "src/index.js"
compatibility_date = "2026-06-29"
compatibility_flags = ["nodejs_compat"]

# 静态资源（public/ 下的 HTML/CSS/JS）
[assets]
directory = "./public"
binding = "ASSETS"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "appointment-db"
database_id = "0b41ee51-cf71-4ce3-afe7-f0a5a5cf604d"

# Durable Object：持有 OneBot 反向 WS 连接
[[durable_objects.bindings]]
name = "ONEBOT_BRIDGE"
class_name = "OneBotBridge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OneBotBridge"]

# 定时提醒：每分钟执行
[triggers]
crons = ["* * * * *"]

# 业务配置（敏感值不放仓库，通过 secret 设置；本地开发放 .dev.vars）
#   wrangler secret put TEACHER_INVITE_CODE   # 老师注册邀请码
#   wrangler secret put NOTIFY_GROUP_ID       # 预约通知 QQ 群号
#   wrangler secret put ONEBOT_TOKEN          # OneBot 连接鉴权 token
